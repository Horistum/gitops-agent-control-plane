name: FlowAI reference product CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product:
    name: flowai-reference-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 ci/run_tests.py
