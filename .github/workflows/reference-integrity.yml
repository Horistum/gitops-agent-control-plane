name: Reference integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-reference:
    name: validate-reference-py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Repository, unit, and conformance validation
        run: ./scripts/agentctl validate
      - name: Install schema comparison dependency
        if: matrix.python == '3.13'
        run: python -m pip install -r requirements-test.txt
      - name: Compare published schemas with standard JSON Schema validation
        if: matrix.python == '3.13'
        env:
          PYTHONPATH: .
        run: python tests/test_schema_interoperability.py --require-reference -v
      - name: Preserve happy-path showcase in logs
        if: matrix.python == '3.13'
        run: ./scripts/agentctl demo happy-path
