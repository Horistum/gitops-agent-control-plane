name: Reference integrity

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reference-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-reference:
    name: validate-reference-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Repository, unit, and conformance validation
        run: ./scripts/agentctl validate
      - name: Install schema comparison dependency
        if: matrix.python == '3.13'
        run: python -m pip install -r requirements-test.txt
      - name: Compare published schemas with standard JSON Schema validation
        if: matrix.python == '3.13'
        env:
          PYTHONPATH: .
        run: python tests/test_schema_interoperability.py --require-reference -v
      - name: Preserve happy-path showcase in logs
        if: matrix.python == '3.13'
        run: ./scripts/agentctl demo happy-path

  operational-container:
    name: operational-rootless-podman
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install rootless execution prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
      - name: Prepare the test image and run the real isolated lifecycle
        run: |
          podman pull docker.io/library/python:3.12-slim
          test_image="$(podman image inspect docker.io/library/python:3.12-slim --format '{{index .RepoDigests 0}}')"
          python -S scripts/check_podman_runtime.py --image "$test_image"

  operational-package:
    name: operational-installed-package
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build and install the complete distribution
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m pip install --no-deps --target "$RUNNER_TEMP/installed" "$RUNNER_TEMP"/wheels/*.whl
      - name: Run the complete lifecycle from installed bytes outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -c 'import os, shutil; shutil.rmtree(os.path.join(os.environ["RUNNER_TEMP"], "installed", "reference_runtime"))'
          PYTHONPATH="$RUNNER_TEMP/installed:$GITHUB_WORKSPACE/tests" python -S -m unittest \
            test_operational_runtime.OperationalRuntimeTests.test_real_subprocess_provider_git_tests_two_item_goal_and_retained_regressions \
            test_governance_middleware.MiddlewareTests.test_v2_real_provider_credentials_usage_and_complete_goal \
            test_governance_middleware.MiddlewareTests.test_review_http_auth_origin_host_snapshot_and_approval \
            test_recovery_operations test_owner_operations test_recovery_certification test_prompt_layout test_registry \
            test_discovery_recovery test_anthropic_adapter test_runtime_diagnostics test_operator_explain \
            test_agent_worker test_worker_adapter test_reverification control_plane_core.execution_conformance -v
      - name: Check the actual Codex CLI contract without model credentials
        run: |
          npm install --global @openai/codex@0.153.4
          python -S -c 'from agent_runtime.reasoning import Reasoning; print(Reasoning({"kind":"codex", "argv":["codex"]}).preflight())'
          python -S -m agent_worker.capabilities --codex codex --expected-version 'codex-cli 0.153.4'
