name: Reference integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-reference:
    name: validate-reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Shell and repository validation
        run: ./scripts/agentctl validate
      - name: Preserve a real happy-path showcase in CI logs
        run: ./scripts/agentctl demo happy-path
