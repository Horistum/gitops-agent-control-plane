name: Private maintainer audit snapshot
on:
  push:
    branches: [fix/publication-readiness-192]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain an exact private source snapshot for the publication audit
        run: |
          git bundle create "$RUNNER_TEMP/source.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/source.sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-maintainer-source
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.sha
          retention-days: 1
          if-no-files-found: error
