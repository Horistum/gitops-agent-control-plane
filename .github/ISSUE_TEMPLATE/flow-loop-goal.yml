name: Flow Loop goal
description: Start one bounded autonomous engineering goal without using the controller shell.
title: "[Flow Loop Goal] "
body:
  - type: markdown
    attributes:
      value: |
        <!-- flow-loop-goal:v1 -->
        Vyplněním tohoto formuláře vytvoří vlastník neměnný GoalEnvelope. Po odeslání tělo Issue neupravujte; opravu proveďte zavřením Issue a založením nového formuláře.
  - type: textarea
    id: objective
    attributes:
      label: Cíl
      description: Popište výsledný stav, nikoli jednotlivé shellové kroky.
      placeholder: Dokonči DEMO-001 jako malou ověřitelnou změnu.
    validations:
      required: true
  - type: textarea
    id: roadmap-items
    attributes:
      label: Položky roadmapy
      description: Explicitní identifikátory oddělené čárkou nebo novým řádkem. Controller mezi nimi volí další přípustnou práci sám.
      placeholder: DEMO-001
    validations:
      required: true
  - type: dropdown
    id: risk-ceiling
    attributes:
      label: Nejvyšší přijatelné riziko
      options:
        - LOW
        - MEDIUM
        - HIGH
    validations:
      required: true
  - type: dropdown
    id: auto-merge
    attributes:
      label: Automatický merge
      description: Critical paths a HIGH změny vždy zůstávají za rozhodovací hranicí.
      options:
        - Vypnuto
        - Jen LOW
        - LOW a MEDIUM
    validations:
      required: true
  - type: textarea
    id: success-condition
    attributes:
      label: Podmínka dokončení
      description: Pozorovatelná podmínka, po které má být cíl označen jako splněný.
      placeholder: DEMO-001 je merged a post-merge check je zelený.
    validations:
      required: true
  - type: textarea
    id: forbidden-directions
    attributes:
      label: Zakázané směry
      description: Omezení nad rámec authority policy. Napište „Žádné další“, pokud další nejsou.
      placeholder: Neměnit CI workflow ani control-plane kontrakt.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Potvrzení
      options:
        - label: Rozumím, že Goal Issue schvaluje pouze uvedený rozsah a nikdy neobchází hard safety gates.
          required: true
