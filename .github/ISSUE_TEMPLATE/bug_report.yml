name: Bug report
description: Report a reproducible non-security bug.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include vulnerabilities, credentials, private source or raw run state. Follow the Security Policy for private reports.
  - type: input
    id: version
    attributes:
      label: Release or exact commit
      description: Include the runtime profile, OS and Python version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and include the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted output
      render: text
