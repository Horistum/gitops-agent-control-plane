[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitops-agent-control-core"
version = "1.4.0"
description = "Portable authority decisions for bounded autonomous software delivery"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
agent-control = "agent_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["control_plane_core*", "agent_runtime*", "reference_runtime*"]

[tool.setuptools.package-data]
control_plane_core = ["*.md", "*.json"]

