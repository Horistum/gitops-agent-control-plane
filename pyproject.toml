[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitops-agent-control-core"
version = "1.8.2"
description = "Provider-neutral trust and governance for bounded software delivery"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
agent-control = "agent_runtime.cli:main"
agent-reasoning-openai = "agent_runtime.openai_adapter:main"
agent-reasoning-anthropic = "agent_runtime.anthropic_adapter:main"
agent-verify-adapter = "agent_runtime.adapter_check:main"

[tool.setuptools.packages.find]
include = ["control_plane_core*", "agent_runtime*", "reference_runtime*"]

[tool.setuptools.package-data]
control_plane_core = ["*.md", "*.json"]
